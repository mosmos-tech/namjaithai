# ตรวจโค้ดอัตโนมัติทุกครั้งที่เปิด/อัปเดต PR และทุกครั้งที่ merge เข้า develop/uat/main
# ถ้าขั้นไหนล้ม เช็ก "ci" จะเป็นสีแดง และ ruleset จะไม่ยอมให้กด merge
name: CI

on:
  pull_request:
  push:
    branches: [develop, uat, main]

# push ซ้ำใน PR เดิม ให้ยกเลิกรอบเก่าที่ยังรันไม่จบ ประหยัดเวลา
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # build จริงเพื่อจับ error ที่ lint/typecheck ไม่เห็น (เช่น ลืมครอบ <Suspense>)
      # ใช้ค่าปลอมของ Supabase เพราะตอน build ไม่ได้ต่อฐานข้อมูลจริง และไม่ต้องใส่คีย์ลับใน CI
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SECRET_KEY: ci-placeholder

  # E2E (TF-48): เปิดเว็บจริงด้วย Playwright บน Chrome ทั้งขนาดมือถือ (iPhone SE) และจอคอม
  # แยก job รันคู่ขนานกับ ci ข้างบน ใช้ Supabase ในเครื่อง CI (Docker) ไม่แตะฐานข้อมูลจริง
  # test ล้มแล้วเก็บวิดีโอ/ภาพหน้าจอ/trace ไว้ดาวน์โหลดได้ที่หน้า Actions (Artifacts)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ข้าม service ที่เว็บยังไม่ใช้ ให้เปิดเร็วขึ้น (migration + seed จังหวัดรันเองตอน start)
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime

      # เขียน .env.local จากคีย์ของ Supabase ใน CI (คีย์ทดสอบที่สร้างใหม่ทุกครั้ง ไม่ใช่ความลับ)
      - name: Write .env.local
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            # TF-36: ค่าทดสอบของ SMS gateway (ไม่ใช่ความลับ ไม่มี API key = ไม่ส่ง SMS จริง)
            echo "NEXT_PUBLIC_SMS_GATEWAY_NUMBER=0800000036"
            echo "HTTPSMS_WEBHOOK_SIGNING_KEY=e2e-tf36-signing-key-not-secret"
          } > .env.local

      # TF-43: verify owner-only reads and notification outbox permissions.
      - run: npm run test:db

      # ใช้ Google Chrome ที่มีในเครื่อง CI อยู่แล้ว โหลดเพิ่มแค่ ffmpeg สำหรับอัดวิดีโอ
      - run: npx playwright install ffmpeg

      - run: npm run e2e

      # TF-41: service-worker/offline behavior must run against a production build.
      - run: npm run build
      - run: npm run e2e:pwa

      - name: Upload videos and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
